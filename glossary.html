<script>
(function(){
  "use strict";
  var acc = PA.cssv("--accent"), soft = PA.cssv("--ink-soft");
  function nth(a,k,desc){ var s=a.slice().sort(function(x,y){ return desc?y-x:x-y; }); return s[Math.min(k,s.length-1)]; }
  function swingLow(bs,a,b){ var idx=a,v=bs[a][2]; for(var i=a;i<b;i++){ if(bs[i][2]<v){v=bs[i][2];idx=i;} } return [idx,v]; }
  function swingHigh(bs,a,b){ var idx=a,v=bs[a][1]; for(var i=a;i<b;i++){ if(bs[i][1]>v){v=bs[i][1];idx=i;} } return [idx,v]; }

  var CATS = [
    { key:"all",  name:"全部", icon:'<path d="M4 6h16M4 12h16M4 18h16"/>' },
    { key:"k",    name:"K线",  icon:'<rect x="9" y="4" width="6" height="12" rx="1"/><path d="M12 2v2M12 16v6"/>' },
    { key:"jg",   name:"结构",  icon:'<path d="M4 18l5-6 4 3 7-9"/><circle cx="9" cy="12" r="1.6"/><circle cx="13" cy="15" r="1.6"/>' },
    { key:"qs",   name:"趋势",  icon:'<path d="M3 17l6-6 4 4 8-9"/><path d="M21 6v5h-5"/>' },
    { key:"qj",   name:"区间",  icon:'<rect x="3" y="7" width="18" height="10" rx="1.5"/><path d="M3 9h18M3 15h18"/>' },
    { key:"fx",   name:"风险",  icon:'<path d="M12 3l8 3v6c0 5-3.4 7.6-8 9-4.6-1.4-8-4-8-9V6z"/>' }
  ];

  // 单根K线术语用 candle 渲染；其余用 series + 标注
  var TERMS = [
    { cat:"k", name:"K线实体", desc:"开盘价与收盘价之间的矩形，反映这段时间价格的净涨跌。", candle:[38,70,30,62] },
    { cat:"k", name:"上影线", desc:"实体上方的细线，记录这一时段的最高价高于开盘和收盘。长上影说明价格冲高后收回，但原因要结合上下文判断。", candle:[46,80,42,53] },
    { cat:"k", name:"下影线", desc:"实体下方的细线，记录这一时段的最低价低于开盘和收盘。长下影说明价格下探后收回，但不等于反转已经成立。", candle:[54,60,20,49] },
    { cat:"k", name:"十字星", desc:"开盘价与收盘价接近，说明这一时段净变化很小。它可以出现在整理或转折附近，方向要看所处位置和后续走势。", candle:[50,70,30,50.4] },

    { cat:"jg", name:"更高高点 HH", desc:"一个波段高点高于前一个波段高点，是上涨结构的一项证据。单独一个新高还不能确认趋势。", g:[18,71,{start:38,vol:0.7,rise:16,amp:2}], a:"up" },
    { cat:"jg", name:"更高低点 HL", desc:"回调低点高于前一个波段低点。连续的 HH 与 HL 常见于上涨结构。", g:[18,72,{start:38,vol:0.7,rise:13,amp:3}], a:"up" },
    { cat:"jg", name:"更低低点 LL", desc:"一个波段低点低于前一个波段低点，是下跌结构的一项证据。", g:[18,73,{start:52,vol:0.7,rise:-15,amp:2}], a:"down" },
    { cat:"jg", name:"更低高点 LH", desc:"反弹高点低于前一个波段高点。连续的 LH 与 LL 常见于下跌结构。", g:[18,74,{start:52,vol:0.7,rise:-12,amp:3}], a:"down" },

    { cat:"qs", name:"上升趋势", desc:"高点与低点不断抬高，价格总体向上运行。", g:[22,75,{start:36,vol:0.7,rise:18,amp:3}], a:"trendUp" },
    { cat:"qs", name:"下降趋势", desc:"高点与低点不断降低，价格总体向下运行。", g:[22,76,{start:54,vol:0.7,rise:-17,amp:3}], a:"trendDown" },
    { cat:"qs", name:"回调", desc:"趋势中的一段反向或横向运动。只有原趋势恢复后，才能确认这段运动最终只是回调。", g:[24,77,{start:38,vol:0.7,rise:15,amp:6}], a:"pullback" },

    { cat:"qj", name:"支撑", desc:"价格曾停止下跌或向上反转的区域。再次到达时可能产生反应，也可能被直接跌破。", g:[22,81,{start:44,vol:0.9,rise:0,amp:2.4}], a:"support" },
    { cat:"qj", name:"阻力", desc:"价格曾停止上涨或向下反转的区域。它是观察区，不是一条保证有效的墙。", g:[22,82,{start:44,vol:0.9,rise:0,amp:2.4}], a:"resistance" },
    { cat:"qj", name:"交易区间", desc:"价格在支撑与阻力之间横着来回，没有明显方向。", g:[26,83,{start:44,vol:1.0,rise:0,amp:2.4}], a:"box" },
    { cat:"qj", name:"假突破", desc:"价格突破关键位后迅速回落，未能延续突破方向。也叫突破失败。", bars:[[44,48,43,47],[47,49,45,48],[48,50,46,47],[47,49,44,46],[46,49,45,48],[48,50,46,47],[47,53,46,48],[48,49,44,45],[45,47,41,42],[42,44,39,40],[40,42,38,39]], a:"falseBreak" },
    { cat:"qj", name:"突破测试", desc:"突破之后价格回到被突破的边界附近，再决定去向。守住则原方向可能继续，明显跌回结构内则说明突破没有成立。", bars:[[44,47.4,43.2,46.8],[46.8,47.6,45.2,45.6],[45.6,47.2,44.4,46.9],[46.9,47.5,45.6,45.9],[45.9,47.3,45.1,46.9],[46.9,50.4,46.7,50.1],[50.1,51.6,49.8,51.2],[51.2,51.5,49,49.4],[49.4,49.8,47.8,49.2],[49.2,51.4,49,51.1],[51.1,53,50.8,52.7]], res:47.6, a:"breakTest" },
    { cat:"qj", name:"失败的失败", desc:"突破先失败、价格跌回结构内，但这次反向运动本身也没走成，价格重新回到最初的突破方向。常按突破回踩或二次入场来处理。", bars:[[44,47.4,43.2,46.8],[46.8,47.6,45.2,45.6],[45.6,47.2,44.4,46.9],[46.9,47.5,45.6,45.9],[45.9,47.3,45.1,46.9],[46.9,50,46.7,49.6],[49.6,49.9,47,47.3],[47.3,47.6,45.8,46.1],[46.1,48,45.9,47.9],[47.9,50.4,47.7,50.1],[50.1,52,49.8,51.7]], res:47.6, a:"failedFailure" },
    { cat:"qj", name:"铁丝网", desc:"紧凑、高度重叠、夹着十字星或极小实体的横盘，通常位于区间中部。这类环境里常见形态大多失去意义，默认不交易。", bars:[[48.4,48.9,47.4,48.2],[48.2,48.7,47.6,47.8],[47.8,48.8,47.3,48.6],[48.6,48.9,47.7,47.9],[47.9,48.6,47.5,48.5],[48.5,48.8,47.6,47.7],[47.7,48.7,47.2,48.3],[48.3,48.6,47.5,47.6],[47.6,48.5,47.4,48.4],[48.4,48.7,47.3,47.5],[47.5,48.6,47.2,48.2]], a:"barbwire" },

    { cat:"jg", name:"楔形（三推）", desc:"价格朝同一方向推进三次，每一推的幅度递减，两条边线逐渐收敛。它说明动能在衰减，但楔形方向不等于突破方向。", bars:[[40,43.5,39.6,43.2],[43.2,46.8,43,46.4],[46.4,46.9,44.2,44.6],[44.6,48.2,44.4,47.9],[47.9,49.4,47.6,49],[49,49.2,47.6,47.9],[47.9,50.4,47.7,50.1],[50.1,51,49.8,50.4],[50.4,50.7,49.4,49.6]], a:"wedge" },
    { cat:"jg", name:"三角形", desc:"价格在两条逐渐靠拢的边界之间反复折返，是一种收紧的交易区间。边界内部方向未定，通常要等突破和后续跟进。", bars:[[44,48,42,47],[47,47.4,40,40.8],[40.8,46.4,40.5,46],[46,46.2,41.7,42.1],[42.1,45.3,41.9,45],[45,45.2,42.8,43.1],[43.1,44.6,42.9,44.3],[44.3,44.5,43.5,43.8]], a:"triangle" },
    { cat:"jg", name:"双重顶", desc:"价格两次测试相近高位，第二次未能持续走高。两顶之间的低点是颈线；形态既可能发展成反转，也可能只是空头趋势中的熊旗。", bars:[[40,44,39.5,43.5],[43.5,47,43.2,46.6],[46.6,50,46.3,49.4],[49.4,49.7,45.2,45.8],[45.8,47.4,44.1,44.7],[44.7,49.8,44.4,49.1],[49.1,49.5,45.4,46],[46,46.3,42.7,43.2]], a:"doubleTop" },
    { cat:"jg", name:"双重底", desc:"价格两次测试相近低位，第二次未能持续走低。两底之间的高点是颈线；形态既可能发展成反转，也可能只是多头趋势中的牛旗。", bars:[[50,50.5,46,46.5],[46.5,46.8,42.5,43],[43,43.4,39.8,40.5],[40.5,45,40.2,44.4],[44.4,46,42.6,45.2],[45.2,45.5,40.1,40.8],[40.8,45,40.5,44.5],[44.5,48,44.2,47.4]], a:"doubleBottom" },
    { cat:"jg", name:"微型双重顶 / 底", desc:"通常压缩在 1–5 根 K 线里的双重测试：连续或近乎连续的相近高点、低点。结构很短，判断尤其依赖此前趋势、所在位置和后续跟进。", bars:[[44,48,43.7,47.5],[47.5,48.1,46,46.4],[46.4,47.9,46.2,46.7],[46.7,47,44.2,44.6],[44.6,44.9,42.4,42.9]], a:"microDouble" },

    { cat:"fx", name:"止损", desc:"交易前设定的退出条件或价格，用于限制单笔风险。快速行情中，实际成交可能差于预定价格。", g:[20,85,{start:40,vol:0.7,rise:12,amp:2}], a:"stop" },
    { cat:"fx", name:"盈亏比", desc:"计划盈利距离与计划亏损距离的比值。判断时还要考虑成功概率、手续费和滑点，数值高不代表交易一定更好。", g:[20,86,{start:40,vol:0.7,rise:13,amp:2}], a:"rr" }
  ];

  function annos(bars, type, term){
    if(!type) return [];
    var highs=bars.map(function(b){return b[1];}), lows=bars.map(function(b){return b[2];});
    var n=bars.length;
    if(type==="resistance") return [{type:"hline", value:nth(highs,1,true), label:"阻力", color:acc}];
    if(type==="support")    return [{type:"hline", value:nth(lows,1,false), label:"支撑", color:acc}];
    if(type==="box")        return [{type:"hline", value:nth(highs,1,true), label:"阻力", color:acc},{type:"hline", value:nth(lows,1,false), label:"支撑", color:acc}];
    if(type==="up"||type==="down"){
      var h=swingHigh(bars,0,n), l=swingLow(bars,0,n);
      return [{type:"label", i:h[0], value:h[1], text:type==="up"?"HH":"LH", color:acc},{type:"label", i:l[0], value:l[1], text:type==="up"?"HL":"LL", color:acc}];
    }
    if(type==="trendUp"){ var a1=swingLow(bars,0,Math.floor(n/2)), a2=swingLow(bars,Math.floor(n/2),n); return [{type:"line", points:[[a1[0],a1[1]],[a2[0],a2[1]]], color:acc}]; }
    if(type==="trendDown"){ var b1=swingHigh(bars,0,Math.floor(n/2)), b2=swingHigh(bars,Math.floor(n/2),n); return [{type:"line", points:[[b1[0],b1[1]],[b2[0],b2[1]]], color:acc}]; }
    if(type==="pullback"){ var m=Math.floor(n*0.55); return [{type:"line", points:[[1,bars[1][2]],[n-2,bars[n-2][1]]], dash:true, color:soft},{type:"label", i:m, value:bars[m][2], text:"回调", color:acc}]; }
    if(type==="falseBreak"){
      var res=nth(highs,1,true);                 // 阻力＝第二高（把那根插针排除在外）
      var pk=0, pv=-Infinity; for(var i=0;i<n;i++){ if(highs[i]>pv){ pv=highs[i]; pk=i; } }  // 插针那根
      return [{type:"hline", value:res, label:"阻力", color:acc}, {type:"label", i:pk, value:bars[pk][1], text:"假突破", color:acc}];
    }
    if(type==="wedge"){
      return [{type:"label", i:1, value:bars[1][1]+0.4, text:"1", color:acc},
              {type:"label", i:4, value:bars[4][1]+0.4, text:"2", color:acc},
              {type:"label", i:7, value:bars[7][1]+0.4, text:"3", color:acc}];
    }
    if(type==="triangle"){
      return [{type:"line", points:[[0,48],[n-1,44.5]], color:soft},
              {type:"line", points:[[1,40],[n-1,43.5]], color:acc}];
    }
    if(type==="doubleTop"){
      return [{type:"label", i:2, value:bars[2][1]+1, text:"测试 1", color:soft},
              {type:"label", i:5, value:bars[5][1]+1, text:"测试 2", color:acc},
              {type:"hline", value:44.1, label:"颈线", color:soft}];
    }
    if(type==="doubleBottom"){
      return [{type:"label", i:2, value:bars[2][2]-1, text:"测试 1", color:soft},
              {type:"label", i:5, value:bars[5][2]-1, text:"测试 2", color:acc},
              {type:"hline", value:46, label:"颈线", color:soft}];
    }
    if(type==="microDouble"){
      return [{type:"label", i:1, value:bars[1][1]+0.8, text:"1", color:soft},
              {type:"label", i:2, value:bars[2][1]+0.8, text:"2", color:acc}];
    }
    if(type==="barbwire"){
      return [{type:"zone", from:nth(lows,0,false), to:nth(highs,0,true), label:"铁丝网", color:acc}];
    }
    if(type==="breakTest"){
      return [{type:"hline", value:term.res, label:"上沿", color:acc}, {type:"label", i:8, value:bars[8][2]-1.2, text:"测试", color:acc}];
    }
    if(type==="failedFailure"){
      return [{type:"hline", value:term.res, label:"上沿", color:acc},
              {type:"label", i:6, value:bars[6][2]-1.2, text:"失败", color:soft},
              {type:"label", i:8, value:bars[8][1]+1.2, text:"逆转", color:acc}];
    }
    if(type==="stop"){ var lo=nth(lows,0,false); return [{type:"hline", value:lo-0.5, label:"止损", color:acc}]; }
    if(type==="rr"){ var lo2=nth(lows,0,false), hi2=nth(highs,0,true); return [{type:"hline", value:hi2, label:"止盈", color:acc},{type:"hline", value:lo2-0.5, label:"止损", color:soft}]; }
    return [];
  }

  var grid = document.getElementById("glogrid"), empty = document.getElementById("gloempty");
  var curCat = "all", curQ = "";

  // 分类按钮
  document.getElementById("glocats").innerHTML = CATS.map(function(c,i){
    return '<button class="glo-cat'+(i===0?' on':'')+'" data-c="'+c.key+'" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+c.icon+'</svg>'+c.name+'</button>';
  }).join("");

  function catName(k){ for(var i=0;i<CATS.length;i++) if(CATS[i].key===k) return CATS[i].name; return ""; }

  function render(){
    var list = TERMS.filter(function(t){
      var okCat = curCat==="all" || t.cat===curCat;
      var okQ = !curQ || (t.name+t.desc).toLowerCase().indexOf(curQ)>-1;
      return okCat && okQ;
    });
    grid.innerHTML = list.map(function(t,i){
      return '<div class="term-card" data-i="'+TERMS.indexOf(t)+'">'+
        '<span class="tc-cat">'+catName(t.cat)+'</span>'+
        '<div class="tc-name">'+t.name+'</div>'+
        '<div class="chartbox"><svg viewBox="0 0 260 150" role="img" aria-label="'+t.name+' 图解"></svg></div>'+
        '<p class="tc-desc">'+t.desc+'</p>'+
      '</div>';
    }).join("");
    empty.style.display = list.length ? "none" : "block";
    draw();
  }

  function draw(){
    Array.prototype.forEach.call(grid.querySelectorAll(".term-card"), function(card){
      var t = TERMS[+card.dataset.i], svg = card.querySelector("svg");
      if(t.candle){ PA.drawCandle(svg, t.candle[0],t.candle[1],t.candle[2],t.candle[3], {lo:15,hi:85,padY:16,bw:46}); }
      else { var bars = t.bars || PA.genSeries(t.g[0], t.g[1], t.g[2]); PA.drawChartSVG(svg, bars, {annotations:annos(bars,t.a,t), ticks:3, padR:34}); }
    });
  }

  document.getElementById("glocats").addEventListener("click", function(e){
    var b=e.target.closest(".glo-cat"); if(!b) return;
    curCat=b.dataset.c;
    Array.prototype.forEach.call(document.querySelectorAll(".glo-cat"), function(x){ x.classList.toggle("on", x===b); });
    render();
  });
  document.getElementById("gloq").addEventListener("input", function(e){ curQ=(e.target.value||"").trim().toLowerCase(); render(); });

  render();
  PA.registerRedraw(draw);   // 颜色约定切换时重绘（虽本页无开关，保持一致）
})();
</script>
</body>
</html>
