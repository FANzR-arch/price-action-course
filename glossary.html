  // 单根K线术语用 candle 渲染；其余用 series + 标注
  var TERMS = [
    { cat:"k", name:"K线实体", l:"01", desc:"开盘价与收盘价之间的矩形，反映这段时间价格的净涨跌。", candle:[38,70,30,62] },
    { cat:"k", name:"上影线", l:"01", desc:"实体上方的细线，记录这一时段的最高价高于开盘和收盘。长上影说明价格冲高后收回，但原因要结合上下文判断。", candle:[46,80,42,53] },
    { cat:"k", name:"下影线", l:"01", desc:"实体下方的细线，记录这一时段的最低价低于开盘和收盘。长下影说明价格下探后收回，但不等于反转已经成立。", candle:[54,60,20,49] },
    { cat:"k", name:"十字星", l:"02", desc:"开盘价与收盘价接近，说明这一时段净变化很小。它可以出现在整理或转折附近，方向要看所处位置和后续走势。", candle:[50,70,30,50.4] },
    { cat:"k", name:"趋势棒", l:"02", desc:"实体大、影线短、收盘靠近一端的 K 线，说明这一时段一方明显占优。单根趋势棒只是力度的证据，还要看位置和下一根有没有跟进。", candle:[38,72,36,70] },
    { cat:"k", name:"锤子线", l:"02", desc:"小实体在上端、下影线很长：价格曾被打低，又收回大部分跌幅。出现在下跌后的支撑附近才可能成为候选多头信号，单独出现没有方向意义。", candle:[52,56,26,55] },
    { cat:"k", name:"流星线", l:"02", desc:"小实体在下端、上影线很长：价格曾冲高，又被压回。出现在上涨后的阻力附近才可能成为候选空头信号。", candle:[48,76,45,46] },
    { cat:"k", name:"吞没", l:"02", desc:"一根 K 线的实体完全覆盖前一根的实体，方向相反。它描述力量的突然转换，但在区间中部或强趋势里很常失效。", bars:[[56,57,52,53],[53,54,49,50],[50,51,47.4,48],[48.2,48.8,47.2,47.6],[47.4,56,47,55.5]], ann:[{type:"label", i:4, value:44, text:"吞没"}] },
    { cat:"k", name:"信号棒 / 入场棒", l:"02", desc:"信号棒是交易者据以计划入场的那根 K 线；入场棒是真正触发订单的下一根。先有背景和位置，信号棒才有意义，入场后仍可能失败。", bars:[[56,57,52,53],[53,54,49,50],[50,51,46,47],[47,50.5,44.5,50],[50,53,49.6,52.6]], ann:[{type:"label", i:3, value:43, text:"信号棒"},{type:"label", i:4, value:54.5, text:"入场棒"}] },

    { cat:"jg", name:"更高高点 HH", l:"05", desc:"一个波段高点高于前一个波段高点，是上涨结构的一项证据。单独一个新高还不能确认趋势。", g:[18,71,{start:38,vol:0.7,rise:16,amp:2}], a:"up" },
    { cat:"jg", name:"更高低点 HL", l:"05", desc:"回调低点高于前一个波段低点。连续的 HH 与 HL 常见于上涨结构。", g:[18,72,{start:38,vol:0.7,rise:13,amp:3}], a:"up" },
    { cat:"jg", name:"更低低点 LL", l:"05", desc:"一个波段低点低于前一个波段低点，是下跌结构的一项证据。", g:[18,73,{start:52,vol:0.7,rise:-15,amp:2}], a:"down" },
    { cat:"jg", name:"更低高点 LH", l:"05", desc:"反弹高点低于前一个波段高点。连续的 LH 与 LL 常见于下跌结构。", g:[18,74,{start:52,vol:0.7,rise:-12,amp:3}], a:"down" },

    { cat:"qs", name:"上升趋势", l:"05", desc:"高点与低点不断抬高，价格总体向上运行。", g:[22,75,{start:36,vol:0.7,rise:18,amp:3}], a:"trendUp" },

    { cat:"qs", name:"L1 / L2", l:"06", desc:"下跌反弹中，第一次有 K 线低点跌破前一根低点记为 L1，第二次记为 L2。与 H1 / H2 方向相反，同样要放回趋势背景里看。", bars:mirror([[38,40,37,39],[39,42,38,41],[41,45,40,44],[44,48,43,47],[47,48,44,45],[45,46,42,43],[43,49,43,48],[48,48,44,45],[45,46,42,43],[43,50,43,49],[49,52,48,51],[51,54,50,53]]), ann:[{type:"label", i:6, value:49, text:"L1"},{type:"label", i:9, value:48, text:"L2"}] },

    { cat:"qs", name:"Always In", l:"08", desc:"假设必须一直持有多单或空单时，当下更合理的方向。它是方向偏向的描述，不是入场信号，会随着强突破或明显失败而切换。", g:[40,93,{start:38,vol:0.7,rise:14,amp:2}], ema:20, ann:[{type:"label", i:30, value:30, text:"偏多"}] },

    { cat:"qs", name:"测量移动", l:"09", desc:"把第一段行情的幅度，从回调低点（或高点）等距投影出去，得到一个候选目标区。它常成为磁力位，但不保证价格一定到达或在那里停止。", bars:[[42.5,43,42,42.8],[42.8,44.8,42.6,44.5],[44.5,46.4,44.2,46.1],[46.1,47.6,45.8,47.3],[47.3,49,47,48.7],[48.7,50,48.4,49.6],[49.6,49.8,48,48.3],[48.3,48.6,46.8,47],[47,47.4,46,47.2],[47.2,49,47,48.8],[48.8,50.8,48.6,50.5],[50.5,52.4,50.3,52.1],[52.1,53.9,51.9,53.6],[53.6,54.1,52.6,52.9]], ann:[{type:"hline", value:54, label:"目标"},{type:"label", i:0, value:40, text:"A"},{type:"label", i:5, value:52, text:"B"},{type:"label", i:8, value:44, text:"C"}] },

    { cat:"qj", name:"支撑", l:"03", desc:"价格曾停止下跌或向上反转的区域。再次到达时可能产生反应，也可能被直接跌破。", g:[22,81,{start:44,vol:0.9,rise:0,amp:2.4}], a:"support" },

    { cat:"qj", name:"交易区间", l:"10", desc:"价格在支撑与阻力之间横着来回，没有明显方向。", g:[26,83,{start:44,vol:1.0,rise:0,amp:2.4}], a:"box" },
    { cat:"qj", name:"假突破", l:"11", desc:"价格突破关键位后迅速回落，未能延续突破方向。也叫突破失败。", bars:[[44,48,43,47],[47,49,45,48],[48,50,46,47],[47,49,44,46],[46,49,45,48],[48,50,46,47],[47,53,46,48],[48,49,44,45],[45,47,41,42],[42,44,39,40],[40,42,38,39]], a:"falseBreak" },
    { cat:"qj", name:"突破测试", l:"12", desc:"突破之后价格回到被突破的边界附近，再决定去向。守住则原方向可能继续，明显跌回结构内则说明突破没有成立。", bars:[[44,47.4,43.2,46.8],[46.8,47.6,45.2,45.6],[45.6,47.2,44.4,46.9],[46.9,47.5,45.6,45.9],[45.9,47.3,45.1,46.9],[46.9,50.4,46.7,50.1],[50.1,51.6,49.8,51.2],[51.2,51.5,49,49.4],[49.4,49.8,47.8,49.2],[49.2,51.4,49,51.1],[51.1,53,50.8,52.7]], res:47.6, a:"breakTest" },
    { cat:"qj", name:"失败的失败", l:"12", desc:"突破先失败、价格跌回结构内，但这次反向运动本身也没走成，价格重新回到最初的突破方向。常按突破回踩或二次入场来处理。", bars:[[44,47.4,43.2,46.8],[46.8,47.6,45.2,45.6],[45.6,47.2,44.4,46.9],[46.9,47.5,45.6,45.9],[45.9,47.3,45.1,46.9],[46.9,50,46.7,49.6],[49.6,49.9,47,47.3],[47.3,47.6,45.8,46.1],[46.1,48,45.9,47.9],[47.9,50.4,47.7,50.1],[50.1,52,49.8,51.7]], res:47.6, a:"failedFailure" },

    { cat:"qj", name:"被套交易者", l:"19", desc:"按某个信号入场后，价格朝反方向走、被迫止损或仍在浮亏的一方。他们离场的价位（入场价、止损价）常影响后面的走势。", bars:[[48,49,47.2,47.6],[47.6,48,46,46.3],[46.3,46.8,45,45.4],[45.4,46.6,44.8,46.4],[46.4,47.6,46.2,47.3],[47.3,47.5,45.9,46.1],[46.1,46.3,44.2,44.4],[44.4,44.6,43.4,43.8],[43.8,45.2,43.6,45],[45,46.4,44.8,46.2],[46.2,46.8,45.6,45.8],[45.8,46,44.6,44.9]], ann:[{type:"hline", value:46.6, label:"多头入场价"},{type:"label", i:6, value:42, text:"多头被套"}] },

    { cat:"jg", name:"楔形（三推）", l:"14", desc:"价格朝同一方向推进三次，每一推的幅度递减，两条边线逐渐收敛。它说明动能在衰减，但楔形方向不等于突破方向。", bars:[[40,43.5,39.6,43.2],[43.2,46.8,43,46.4],[46.4,46.9,44.2,44.6],[44.6,48.2,44.4,47.9],[47.9,49.4,47.6,49],[49,49.2,47.6,47.9],[47.9,50.4,47.7,50.1],[50.1,51,49.8,50.4],[50.4,50.7,49.4,49.6]], a:"wedge" },
    { cat:"jg", name:"三角形", l:"15", desc:"价格在两条逐渐靠拢的边界之间反复折返，是一种收紧的交易区间。边界内部方向未定，通常要等突破和后续跟进。", bars:[[44,48,42,47],[47,47.4,40,40.8],[40.8,46.4,40.5,46],[46,46.2,41.7,42.1],[42.1,45.3,41.9,45],[45,45.2,42.8,43.1],[43.1,44.6,42.9,44.3],[44.3,44.5,43.5,43.8]], a:"triangle" },
    { cat:"jg", name:"双重顶", l:"16", desc:"价格两次测试相近高位，第二次未能持续走高。两顶之间的低点是颈线；形态既可能发展成反转，也可能只是空头趋势中的熊旗。", bars:[[40,44,39.5,43.5],[43.5,47,43.2,46.6],[46.6,50,46.3,49.4],[49.4,49.7,45.2,45.8],[45.8,47.4,44.1,44.7],[44.7,49.8,44.4,49.1],[49.1,49.5,45.4,46],[46,46.3,42.7,43.2]], a:"doubleTop" },
    { cat:"jg", name:"双重底", l:"16", desc:"价格两次测试相近低位，第二次未能持续走低。两底之间的高点是颈线；形态既可能发展成反转，也可能只是多头趋势中的牛旗。", bars:[[50,50.5,46,46.5],[46.5,46.8,42.5,43],[43,43.4,39.8,40.5],[40.5,45,40.2,44.4],[44.4,46,42.6,45.2],[45.2,45.5,40.1,40.8],[40.8,45,40.5,44.5],[44.5,48,44.2,47.4]], a:"doubleBottom" },
    { cat:"jg", name:"微型双重顶 / 底", l:"16", desc:"通常压缩在 1–5 根 K 线里的双重测试：连续或近乎连续的相近高点、低点。结构很短，判断尤其依赖此前趋势、所在位置和后续跟进。", bars:[[44,48,43.7,47.5],[47.5,48.1,46,46.4],[46.4,47.9,46.2,46.7],[46.7,47,44.2,44.6],[44.6,44.9,42.4,42.9]], a:"microDouble" },
    { cat:"jg", name:"最终旗形", l:"17", desc:"一段趋势后出现的延续形态候选，通常偏横向并靠近磁力位。顺势突破失败、回到旗形并反向后，才显出“最终”的意义；此前只能称潜在最终旗形。", bars:[[40,44,39.7,43.7],[43.7,48,43.4,47.6],[47.6,52.2,47.3,51.8],[51.8,55.8,51.5,55.4],[55.4,56,53.8,54.2],[54.2,55.7,53.9,55.2],[55.2,57.3,54.9,56.8],[56.8,57,53,53.5],[53.5,53.8,50.5,51]], a:"finalFlag" },
    { cat:"jg", name:"颈线", l:"16", desc:"双重顶两顶之间的低点（或双重底两底之间的高点）。价格收盘离开颈线并得到跟进，形态才从候选变成更有力的证据。", bars:[[40,44,39.5,43.5],[43.5,47,43.2,46.6],[46.6,50,46.3,49.4],[49.4,49.7,45.2,45.8],[45.8,47.4,44.1,44.7],[44.7,49.8,44.4,49.1],[49.1,49.5,45.4,46],[46,46.3,42.7,43.2]], ann:[{type:"hline", value:44.1, label:"颈线"}] },
    { cat:"jg", name:"主要趋势反转 MTR", l:"18", desc:"一段过程：原趋势清晰 → 趋势线被有力突破 → 回测旧极点失败 → 反向突破并跟进。条件齐全时，也有不少会演变成旗形或交易区间。", bars:[[40,41.6,39.6,41.2],[41.2,42.8,40.8,42.5],[42.5,43,41.6,42],[42,44.2,41.8,43.9],[43.9,45.8,43.6,45.4],[45.4,45.9,44.3,44.6],[44.6,47,44.4,46.7],[46.7,48.8,46.4,48.4],[48.4,49,47.3,47.6],[47.6,50,47.4,49.6],[49.6,51.8,49.3,51.4],[51.4,51.6,49.4,49.8],[49.8,50.1,47,47.3],[47.3,47.6,45.2,45.6],[45.6,47.6,45.3,47.2],[47.2,49.4,46.9,49],[49,50.6,48.7,50.2],[50.2,50.4,48.2,48.5],[48.5,48.7,46.1,46.4],[46.4,46.6,44.6,44.9],[44.9,45.2,42.8,43.2],[43.2,43.6,41.6,42]], ann:[{type:"hline", value:51.8, label:"旧高"},{type:"label", i:16, value:53, text:"测试失败"}] },
    { cat:"jg", name:"二次入场", l:"20", desc:"同一方向的第一次尝试失败后，第二次尝试出现时再入场。确认更多，但入场更晚、止损往往更宽，需要重新计算盈亏比。", bars:[[40,42.4,39.8,42.1],[42.1,44.6,41.9,44.3],[44.3,46.9,44,46.6],[46.6,48.8,46.3,48.5],[48.5,48.7,46.9,47.2],[47.2,47.5,45.8,46.1],[46.1,47.7,45.9,47.4],[47.4,47.6,45.4,45.7],[45.7,46,44.9,45.2],[45.2,47.8,45,47.6],[47.6,49.4,47.4,49.1],[49.1,50.8,48.9,50.5]], ann:[{type:"label", i:6, value:49, text:"第一次"},{type:"label", i:9, value:43.5, text:"第二次"}] },

    { cat:"fx", name:"止损", l:"20", desc:"交易前设定的退出条件或价格，用于限制单笔风险。快速行情中，实际成交可能差于预定价格。", g:[20,85,{start:40,vol:0.7,rise:12,amp:2}], a:"stop" },
    { cat:"fx", name:"盈亏比", l:"20", desc:"计划盈利距离与计划亏损距离的比值。判断时还要考虑成功概率、手续费和滑点，数值高不代表交易一定更好。", g:[20,86,{start:40,vol:0.7,rise:13,amp:2}], a:"rr" },
    { cat:"fx", name:"期望值", l:"20", desc:"每笔交易平均能赚或亏多少：胜率 × 平均盈利 − 败率 × 平均亏损。胜率和盈亏比要一起看，只看其中一个都会误判；样本少时估计误差很大。", g:[20,87,{start:40,vol:0.7,rise:10,amp:2}], a:"rr" }
  ];

  // 上下翻转一段 K 线（L1/L2 复用 H1/H2 的数据）
  function mirror(bs){ return bs.map(function(b){ return [100-b[0], 100-b[2], 100-b[1], 100-b[3]]; }); }

  function annos(bars, type, term){
    if(term && term.ann) return term.ann.map(function(a){ var c={}; for(var k in a) c[k]=a[k]; if(!c.color) c.color=acc; return c; });
    if(!type) return [];
    var highs=bars.map(function(b){return b[1];}), lows=bars.map(function(b){return b[2];});
    var n=bars.length;
    if(type==="resistance") return [{type:"hline", value:nth(highs,1,true), label:"阻力", color:acc}];
    if(type==="support")    return [{type:"hline", value:nth(lows,1,false), label:"支撑", color:acc}];
    if(type==="box")        return [{type:"hline", value:nth(highs,1,true), label:"阻力", color:acc},{type:"hline", value:nth(lows,1,false), label:"支撑", color:acc}];
    if(type==="up"||type==="down"){
      var h=swingHigh(bars,0,n), l=swingLow(bars,0,n);
      return [{type:"label", i:h[0], value:h[1], text:type==="up"?"HH":"LH", color:acc},{type:"label", i:l[0], value:l[1], text:type==="up"?"HL":"LL", color:acc}];
    }
    if(type==="trendUp"){ var a1=swingLow(bars,0,Math.floor(n/2)), a2=swingLow(bars,Math.floor(n/2),n); return [{type:"line", points:[[a1[0],a1[1]],[a2[0],a2[1]]], color:acc}]; }
    if(type==="trendDown"){ var b1=swingHigh(bars,0,Math.floor(n/2)), b2=swingHigh(bars,Math.floor(n/2),n); return [{type:"line", points:[[b1[0],b1[1]],[b2[0],b2[1]]], color:acc}]; }
    if(type==="pullback"){ var m=Math.floor(n*0.55); return [{type:"line", points:[[1,bars[1][2]],[n-2,bars[n-2][1]]], dash:true, color:soft},{type:"label", i:m, value:bars[m][2], text:"回调", color:acc}]; }
    if(type==="falseBreak"){
      var res=nth(highs,1,true);                 // 阻力＝第二高（把那根插针排除在外）
      var pk=0, pv=-Infinity; for(var i=0;i<n;i++){ if(highs[i]>pv){ pv=highs[i]; pk=i; } }  // 插针那根
      return [{type:"hline", value:res, label:"阻力", color:acc}, {type:"label", i:pk, value:bars[pk][1], text:"假突破", color:acc}];
    }
    if(type==="wedge"){
      return [{type:"label", i:1, value:bars[1][1]+0.4, text:"1", color:acc},
              {type:"label", i:4, value:bars[4][1]+0.4, text:"2", color:acc},
              {type:"label", i:7, value:bars[7][1]+0.4, text:"3", color:acc}];
    }
    if(type==="triangle"){
      return [{type:"line", points:[[0,48],[n-1,44.5]], color:soft},
              {type:"line", points:[[1,40],[n-1,43.5]], color:acc}];
    }
    if(type==="doubleTop"){
      return [{type:"label", i:2, value:bars[2][1]+1, text:"测试 1", color:soft},
              {type:"label", i:5, value:bars[5][1]+1, text:"测试 2", color:acc},
              {type:"hline", value:44.1, label:"颈线", color:soft}];
    }
    if(type==="doubleBottom"){
      return [{type:"label", i:2, value:bars[2][2]-1, text:"测试 1", color:soft},
              {type:"label", i:5, value:bars[5][2]-1, text:"测试 2", color:acc},
              {type:"hline", value:46, label:"颈线", color:soft}];
    }
    if(type==="microDouble"){
      return [{type:"label", i:1, value:bars[1][1]+0.8, text:"1", color:soft},
              {type:"label", i:2, value:bars[2][1]+0.8, text:"2", color:acc}];
    }
    if(type==="finalFlag"){
      return [{type:"zone", from:53.8, to:56, label:"潜在最终旗形", color:soft},
              {type:"label", i:6, value:58, text:"失败突破", color:acc},
              {type:"label", i:8, value:49.7, text:"反向", color:acc}];
    }
    if(type==="barbwire"){
      return [{type:"zone", from:nth(lows,0,false), to:nth(highs,0,true), label:"铁丝网", color:acc}];
    }
    if(type==="breakTest"){
      return [{type:"hline", value:term.res, label:"上沿", color:acc}, {type:"label", i:8, value:bars[8][2]-1.2, text:"测试", color:acc}];
    }
    if(type==="failedFailure"){
      return [{type:"hline", value:term.res, label:"上沿", color:acc},
              {type:"label", i:6, value:bars[6][2]-1.2, text:"失败", color:soft},
              {type:"label", i:8, value:bars[8][1]+1.2, text:"逆转", color:acc}];
    }
    if(type==="stop"){ var lo=nth(lows,0,false); return [{type:"hline", value:lo-0.5, label:"止损", color:acc}]; }
    if(type==="rr"){ var lo2=nth(lows,0,false), hi2=nth(highs,0,true); return [{type:"hline", value:hi2, label:"止盈", color:acc},{type:"hline", value:lo2-0.5, label:"止损", color:soft}]; }
    return [];
  }

  var grid = document.getElementById("glogrid"), empty = document.getElementById("gloempty");
  var curCat = "all", curQ = "";

  // 分类按钮
  document.getElementById("glocats").innerHTML = CATS.map(function(c,i){
    return '<button class="glo-cat'+(i===0?' on':'')+'" data-c="'+c.key+'" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+c.icon+'</svg>'+c.name+'</button>';
  }).join("");

  function catName(k){ for(var i=0;i<CATS.length;i++) if(CATS[i].key===k) return CATS[i].name; return ""; }

  function render(){
    var list = TERMS.filter(function(t){
      var okCat = curCat==="all" || t.cat===curCat;
      var okQ = !curQ || (t.name+t.desc).toLowerCase().indexOf(curQ)>-1;
      return okCat && okQ;
    });
    grid.innerHTML = list.map(function(t,i){
      return '<div class="term-card" data-i="'+TERMS.indexOf(t)+'">'+
        '<span class="tc-cat">'+catName(t.cat)+'</span>'+
        '<div class="tc-name">'+t.name+'</div>'+
        '<div class="chartbox"><svg viewBox="0 0 260 150" role="img" aria-label="'+t.name+' 图解"></svg></div>'+
        '<p class="tc-desc">'+t.desc+'</p>'+
        (t.l ? '<a class="tc-link" href="./lessons/lesson-'+t.l+'.html">第 '+(+t.l)+' 课讲解 →</a>' : '')+
      '</div>';
    }).join("");
    empty.style.display = list.length ? "none" : "block";
    draw();
  }

  function draw(){
    Array.prototype.forEach.call(grid.querySelectorAll(".term-card"), function(card){
      var t = TERMS[+card.dataset.i], svg = card.querySelector("svg");
      if(t.candle){ PA.drawCandle(svg, t.candle[0],t.candle[1],t.candle[2],t.candle[3], {lo:15,hi:85,padY:16,bw:46}); }
      else { var bars = t.bars || PA.genSeries(t.g[0], t.g[1], t.g[2]); PA.drawChartSVG(svg, bars, {annotations:annos(bars,t.a,t), ticks:3, padR:34, ema:t.ema}); }
    });
  }

  document.getElementById("glocats").addEventListener("click", function(e){
    var b=e.target.closest(".glo-cat"); if(!b) return;
    curCat=b.dataset.c;
    Array.prototype.forEach.call(document.querySelectorAll(".glo-cat"), function(x){ x.classList.toggle("on", x===b); });
    render();
  });
  document.getElementById("gloq").addEventListener("input", function(e){ curQ=(e.target.value||"").trim().toLowerCase(); render(); });

  render();
  PA.registerRedraw(draw);   // 颜色约定切换时重绘（虽本页无开关，保持一致）
})();
</script>
</body>
</html>
